name: Build APK

# Cukup upload file .zip project ini (nama bebas, apa aja yang penting
# ekstensinya .zip) ke root repo GitHub — cuma 1 file, gak perlu extract
# manual dulu. Workflow ini yang extract & build otomatis di server GitHub.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Cari file .zip apa saja di root repo, lalu extract isinya ke
      # folder "extracted/". Ini menghindari masalah nested-folder yang
      # sering terjadi kalau upload manual file-per-file lewat HP.
      - name: Extract project zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Tidak ada file .zip di root repo ini. Upload file .zip project (hasil download dari Claude) langsung ke root repo, jangan di-extract dulu."
            find . -maxdepth 2 -not -path "./.git*" | sort
            exit 1
          fi
          echo "Ketemu zip: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      # Auto-cari folder project Gradle yang sebenarnya di dalam hasil
      # extract, jaga-jaga kalau zip-nya punya folder pembungkus di dalam.
      - name: Locate project root
        id: locate
        run: |
          SETTINGS_FILE=$(find extracted -maxdepth 6 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle.kts tidak ketemu di dalam zip yang di-upload."
            find extracted -maxdepth 4 | sort
            exit 1
          fi
          echo "project_dir=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZBOOSTER-apk
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
