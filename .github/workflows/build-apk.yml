name: Android CI (Build & Unit Test)

# Runs on GitHub's own servers, which (unlike a restricted local sandbox)
# have full network access to Google's Maven repo, Maven Central, and the
# Gradle distribution servers — so this performs a REAL ./gradlew build,
# not a simulation. The Gradle wrapper (gradlew, gradlew.bat,
# gradle/wrapper/gradle-wrapper.jar) is committed directly in this repo,
# so no wrapper-generation step is needed here — this workflow just uses it.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Caches ~/.gradle between runs so subsequent builds are faster.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests (app/src/test)
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zbooster-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/
          if-no-files-found: warn

      - name: Run lint
        if: always()
        run: ./gradlew lintDebug --no-daemon --stacktrace || true

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
